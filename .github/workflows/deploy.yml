name: Deploy to GitHub Pages

on:
  push:
    branches:
      - setup
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # Reinstall explicitly to bypass any committed package-lock.json
      # and guarantee every deploy uses the latest published version.
      - name: Install latest TaxonPages version
        run: npm install @sfgrp/taxonpages

      # Only in the fork weevil-see/taxa, a test site: served under /taxa/
      # (weevil-see.com/taxa/), with its own address for canonical links and
      # the sitemap, and kept out of search engines. Set here, not in the
      # committed config, so merging between the repos never carries them
      # over (on catalog.curculionoidea.org they would break every address
      # and drop the site from search engines).
      - name: Fork test site settings
        if: github.repository == 'weevil-see/taxa'
        run: |
          sed -i 's#^  base_url: /$#  base_url: /taxa/#' config/router.yml
          grep -q '^  base_url: /taxa/$' config/router.yml
          printf '  site_url: https://weevil-see.com/taxa/\n  robots: "noindex, nofollow"\n' >> config/project.yml

      - name: Build public view
        run: npm run build

      # With hash_mode off: an entry page per OTU, 404.html and sitemap.xml,
      # so every page has its own address on GitHub Pages.
      - name: Write route pages
        run: node scripts/write-route-pages.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # About 35,000 files (one per taxon page, scripts/write-route-pages.mjs):
          # GitHub sometimes takes longer than the default 10 minutes to
          # publish them.
          timeout: 1800000
